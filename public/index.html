<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 战术阵容对决 1v1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 首页 -->
  <div id="homeScreen" class="screen">
    <div class="logo">
      <h1>🏀 NBA 战术阵容对决</h1>
      <p>实时 1v1 联机 · 服务器权威判赛</p>
    </div>
    <div class="menu">
      <div class="menu-item">
        <h2>创建房间</h2>
        <input type="text" id="createName" placeholder="你的昵称（可选）" maxlength="12">
        <button id="createBtn">创建房间</button>
      </div>
      <div class="menu-item">
        <h2>加入房间</h2>
        <input type="text" id="joinCode" placeholder="输入6位房间码" maxlength="6">
        <input type="text" id="joinName" placeholder="你的昵称（可选）" maxlength="12">
        <button id="joinBtn">加入房间</button>
      </div>
    </div>
    <div id="homeMsg" class="msg"></div>
  </div>

  <!-- 等待房间 -->
  <div id="waitScreen" class="screen hidden">
    <h2>房间已创建</h2>
    <p>房间码：<strong id="waitRoomCode"></strong></p>
    <button id="copyCodeBtn">复制房间码</button>
    <p id="waitStatus">等待另一位玩家加入……</p>
    <button id="backHomeBtn">返回首页</button>
  </div>

  <!-- 游戏主画布 -->
  <div id="gameScreen" class="screen hidden">
    <!-- 顶部信息栏 -->
    <header class="topbar">
      <div class="room-info">房间：<span id="topRoomCode">-</span></div>
      <div class="phase-badge" id="phaseBadge">WAITING</div>
      <div class="opp-info" id="oppTurnInfo">-</div>
    </header>

    <!-- 对战双方概览 -->
    <section class="versus">
      <div class="player-panel" id="panelSelf">
        <h3 id="selfTitle">我（玩家）</h3>
        <div class="coins">金币：<span id="selfCoins">0</span></div>
        <div class="mini-roster" id="selfMini"></div>
      </div>
      <div class="vs-center">
        <div class="vs-text">VS</div>
        <div class="turn-indicator" id="turnIndicator">准备中</div>
      </div>
      <div class="player-panel" id="panelOpp">
        <h3 id="oppTitle">对手（玩家）</h3>
        <div class="coins">金币：<span id="oppCoins">0</span></div>
        <div class="mini-roster" id="oppMini"></div>
      </div>
    </section>

    <!-- 选人区 -->
    <section id="draftSection" class="hidden">
      <h2 class="section-title">选择你的球员（每轮5选1）</h2>
      <div id="draftPool" class="draft-pool"></div>
      <p class="turn-note" id="draftNote"></p>
    </section>

    <!-- 阵容调整区 -->
    <section id="lineupSection" class="hidden">
      <h2 class="section-title">调整你的首发阵容（拖动球员到位置）</h2>
      <div class="lineup-court">
        <div class="my-bench" id="myBench"></div>
        <div class="positions">
          <div class="pos-slot" data-pos="PG"><div class="pos-label">PG</div><div class="pos-drop" data-pos="PG"></div></div>
          <div class="pos-slot" data-pos="SG"><div class="pos-label">SG</div><div class="pos-drop" data-pos="SG"></div></div>
          <div class="pos-slot" data-pos="SF"><div class="pos-label">SF</div><div class="pos-drop" data-pos="SF"></div></div>
          <div class="pos-slot" data-pos="PF"><div class="pos-label">PF</div><div class="pos-drop" data-pos="PF"></div></div>
          <div class="pos-slot" data-pos="C"><div class="pos-label">C</div><div class="pos-drop" data-pos="C"></div></div>
        </div>
      </div>
      <button id="submitLineupBtn">确认阵容并结算</button>
      <p class="lineup-note" id="lineupNote"></p>
    </section>

    <!-- 结果区 -->
    <section id="resultSection" class="hidden">
      <h1 class="result-title" id="resultTitle">-</h1>
      <div class="result-compare">
        <div class="player-result" id="resultSelf"></div>
        <div class="result-win-banner" id="resultBanner"></div>
        <div class="player-result" id="resultOpp"></div>
      </div>
      <div class="rating-detail" id="ratingDetail"></div>
      <button id="rematchBtn">再来一局</button>
      <button id="exitBtn">退出</button>
    </section>
  </div>

  <!-- 球员属性浮窗 -->
  <div id="playerDetailPopup" class="popup hidden">
    <button id="popupClose" class="popup-close">×</button>
    <div id="playerDetailContent"></div>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- Socket.IO 客户端 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
